name: Publish to Maven Central

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: check
        run: |
          VERSION=$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git show HEAD~1:pom.xml > /tmp/old.xml 2>/dev/null || {
            echo "should_publish=true" >> $GITHUB_OUTPUT
            exit 0
          }

          OLD_VERSION=$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' /tmp/old.xml | head -n 1 || echo "")

          if [ "$VERSION" != "$OLD_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Maven 3.10 stages a maven-metadata-local.xml that
      # central-publishing-maven-plugin 0.11.0 leaves in the upload bundle, and
      # Central rejects the bundle ("Bundle has content that does NOT have a
      # .pom file"). Pin Maven 3.9.16 just like chat-xdk.
      - name: Install Maven 3.9.16
        run: |
          set -euo pipefail
          v=3.9.16
          tgz="$RUNNER_TEMP/apache-maven-$v-bin.tar.gz"
          curl -fsSL -o "$tgz" "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$v/apache-maven-$v-bin.tar.gz"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $tgz" | sha512sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$v/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-$v/bin/mvn" -v

      - name: Build, Test, and Package (JAR, Sources, Javadoc)
        run: mvn package -Prelease -Dgpg.skip=true -B

      - name: Publish to Maven Central (Sonatype Central Portal)
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export SONATYPE_USERNAME="${SONATYPE_USERNAME:-$MAVEN_CENTRAL_USERNAME}"
          export SONATYPE_TOKEN="${SONATYPE_TOKEN:-$MAVEN_CENTRAL_TOKEN}"
          if [ -z "$SONATYPE_USERNAME" ] || [ -z "$SONATYPE_TOKEN" ] || [ -z "$MAVEN_GPG_PRIVATE_KEY" ]; then
            echo "::warning::SONATYPE_USERNAME / SONATYPE_TOKEN / MAVEN_GPG_PRIVATE_KEY secrets are not configured yet; skipping Maven Central deploy."
            exit 0
          fi
          mvn deploy -Prelease -DskipTests -B

      - name: Create tag
        if: needs.check-version.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "v${{ needs.check-version.outputs.version }}" || true
          git push origin "v${{ needs.check-version.outputs.version }}" || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: target/*.jar
